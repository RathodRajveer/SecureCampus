
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Portal | SecureCampus</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-primary px-4">
        <a class="navbar-brand fw-bold" href="/">SecureCampus</a>
        <a class="btn btn-outline-light" href="/">Home</a>
    </nav>

    <main class="container py-5">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h1 class="h3 mb-3">Student Portal</h1>
                <p class="text-muted">
                    Welcome! Your identity is authenticated through Keycloak.
                </p>

                <hr>

                <p><strong>Username:</strong> {{ user.username }}</p>
                <p><strong>Full Name:</strong> {{ user.name or "Not provided" }}</p>
                <p><strong>Email:</strong> {{ user.email or "Not provided" }}</p>

                <span class="badge text-bg-success">
                    Authenticated
                </span>
            </div>
        </div>
    </main>

</body>
</html>
